<!doctype html>
<html>
  <head><meta charset="utf-8"><title>City Time</title></head>
  <body>
    <h1>City Time</h1>
    <form method="get">
      <label>
        City:
        <select name="city">
          {% for c in cities %}
            <option value="{{ c }}" {% if c == city %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </label>
      <button type="submit">Show</button>
    </form>
    <p>Current time in <b>{{ city }}</b>: {{ time }}</p>
    <p><a href="{% url 'welcome' %}">Back</a></p>
  </body>
</html>

<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Users</title></head>
  <body>
    <h1>Users</h1>
    {% for u in users %}
      <section style="border:1px solid #ddd;padding:8px;margin:6px 0;border-radius:6px;">
        <div><b>{{ u.full_name }}</b></div>
        <div>Age: {{ u.age }}</div>
      </section>
    {% empty %}
      <p>No users.</p>
    {% endfor %}
    <p><a href="{% url 'welcome' %}">Back</a></p>
  </body>
</html>
